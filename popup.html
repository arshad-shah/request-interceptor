<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Interceptor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      width: 280px;
      background-color: #f9fafb;
      color: #1f2937;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      text-align: center;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      gap: 10px;
    }
    
    .header-icon {
      font-size: 24px;
      color: #4f46e5;
    }
    
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
    }
    
    .toggle-container {
      margin: 16px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    
    .toggle {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 24px;
    }
    
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #d1d5db;
      transition: .3s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #10b981;
    }
    
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    
    .status {
      font-size: 14px;
      font-weight: 500;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      text-decoration: none;
      margin-top: 12px;
      width: 100%;
    }
    
    .btn:hover {
      background-color: #4338ca;
    }
    
    .stats {
      background-color: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin: 16px 0;
      width: 100%;
      box-sizing: border-box;
    }
    
    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .stat-label {
      color: #6b7280;
      font-size: 13px;
    }
    
    .stat-value {
      font-weight: 500;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">
        <i class="fas fa-bolt"></i>
      </div>
      <h1>Request Interceptor</h1>
    </div>
    
    <div class="toggle-container">
      <span class="status" id="status-text">Disabled</span>
      <label class="toggle">
        <input type="checkbox" id="enableToggle">
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">Active Routes:</span>
        <span class="stat-value" id="routes-count">0</span>
      </div>
    </div>
    
    <button id="open-side-panel" class="btn">
      <i class="fas fa-cog"></i> Configure Routes
    </button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
