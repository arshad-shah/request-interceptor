<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Interceptor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --success: #10b981;
      --danger: #ef4444;
      --border: #e5e7eb;
      --card: #ffffff;
      --background: #f9fafb;
      --background-dark: #f3f4f6;
      --text: #1f2937;
      --text-secondary: #6b7280;
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --radius: 6px;
      --radius-lg: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--background);
      color: var(--text);
      font-size: 14px;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .header {
      background: var(--primary-gradient);
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .toggle {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 24px;
    }
    
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255,255,255,0.3);
      transition: .3s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: var(--success);
    }
    
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    
    .status {
      font-size: 14px;
      font-weight: 500;
    }
    
    .nav {
      background-color: white;
      border-bottom: 1px solid var(--border);
      padding: 0 10px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow);
    }
    
    .tabs {
      display: flex;
      gap: 8px;
    }
    
    .tab {
      padding: 14px 16px;
      position: relative;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      background: none;
      font-size: 14px;
    }
    
    .tab:hover {
      color: var(--primary);
    }
    
    .tab.active {
      color: var(--primary);
    }
    
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--primary);
    }
    
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: var(--text);
    }
    
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s;
      background-color: white;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    textarea {
      height: 120px;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      resize: vertical;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      text-decoration: none;
    }
    
    .btn:hover {
      background-color: var(--primary-dark);
    }
    
    .btn-secondary {
      background-color: white;
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .btn-secondary:hover {
      background-color: var(--background);
    }
    
    .btn-danger {
      background-color: var(--danger);
    }
    
    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }
    
    .route-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .route-item {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      transition: all 0.2s;
      box-shadow: var(--shadow);
    }
    
    .route-item:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    
    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .method-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      min-width: 48px;
    }
    
    .method-GET {
      background-color: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
    }
    
    .method-POST {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }
    
    .method-PUT {
      background-color: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
    }
    
    .method-DELETE {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }
    
    .method-PATCH {
      background-color: rgba(139, 92, 246, 0.1);
      color: #8b5cf6;
    }
    
    .route-url {
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      word-break: break-all;
      font-weight: 500;
    }
    
    .route-details {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }
    
    .detail-item {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 12px;
    }
    
    .route-response {
      margin-top: 12px;
      background-color: var(--background-dark);
      border-radius: var(--radius);
      padding: 12px;
      max-height: 100px;
      overflow-y: auto;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 12px;
    }
    
    .route-actions {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      background-color: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }
    
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--primary);
    }
    
    .card {
      background-color: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    
    .card-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .card-body {
      padding: 16px;
    }
    
    .card-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background-color: var(--background);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    
    /* Notification styling */
    .notification-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }
    
    .notification {
      padding: 12px 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slide-in 0.3s ease-out;
      max-width: 300px;
    }
    
    .notification-success {
      background-color: #d1fae5;
      color: var(--success);
      border-left: 4px solid var(--success);
    }
    
    .notification-error {
      background-color: #fee2e2;
      color: var(--danger);
      border-left: 4px solid var(--danger);
    }
    
    @keyframes slide-in {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    @keyframes fade-out {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }
    
    .fade-out {
      animation: fade-out 0.3s ease-out forwards;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-bolt"></i> Request Interceptor</h1>
      <div class="toggle-container">
        <span class="status" id="status-text">Disabled</span>
        <label class="toggle">
          <input type="checkbox" id="enableToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    
    <div class="nav">
      <div class="tabs">
        <button class="tab active" data-tab="routes"><i class="fas fa-route"></i> Routes</button>
        <button class="tab" data-tab="add"><i class="fas fa-plus"></i> Add Route</button>
      </div>
    </div>
    
    <!-- Routes Tab -->
    <div class="tab-content active" id="routes-tab">
      <div class="route-actions" style="margin-bottom: 20px;">
        <button class="btn btn-danger" id="clear-routes-btn">
          <i class="fas fa-trash-alt"></i> Clear All Routes
        </button>
      </div>
      
      <div id="route-list" class="route-list">
        <!-- Routes will be inserted here dynamically -->
      </div>
    </div>
    
    <!-- Add Route Tab -->
    <div class="tab-content" id="add-tab">
      <div class="card">
        <div class="card-header">
          <span>Configure Interception</span>
        </div>
        <div class="card-body">
          <form id="add-route-form">
            <div class="form-group">
              <label for="url">URL to Intercept:</label>
              <input type="text" id="url" placeholder="e.g. /api/users or https://example.com/api/data" required>
              <div style="margin-top: 4px; color: var(--text-secondary); font-size: 12px;">
                Supports wildcards (*) and query parameters
              </div>
            </div>
            
            <div class="form-group">
              <label for="method">HTTP Method:</label>
              <select id="method">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
                <option value="PATCH">PATCH</option>
              </select>
            </div>
            
            <div style="display: flex; gap: 16px;">
              <div class="form-group" style="flex: 1;">
                <label for="status">Status Code:</label>
                <input type="number" id="status" value="200" min="100" max="599">
              </div>
              
              <div class="form-group" style="flex: 1;">
                <label for="delay">Response Delay (ms):</label>
                <input type="number" id="delay" value="0" min="0">
              </div>
            </div>
            
            <div class="form-group">
              <label for="contentType">Content Type:</label>
              <select id="contentType">
                <option value="application/json">application/json</option>
                <option value="text/plain">text/plain</option>
                <option value="text/html">text/html</option>
                <option value="application/xml">application/xml</option>
              </select>
            </div>
            
            <div class="form-group">
              <label for="responseBody">Response Body:</label>
              <textarea id="responseBody" placeholder='{"status": "success", "data": [{"id": 1, "name": "Example"}]}'>{"status": "success", "data": [{"id": 1, "name": "Example"}]}</textarea>
              <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button type="button" id="formatJsonBtn" class="btn btn-sm btn-secondary">
                  <i class="fas fa-code"></i> Format JSON
                </button>
                <button type="button" id="clearEditorBtn" class="btn btn-sm btn-secondary">
                  <i class="fas fa-eraser"></i> Clear
                </button>
              </div>
            </div>
          </form>
        </div>
        <div class="card-footer">
          <button type="button" id="addRouteBtn" class="btn">
            <i class="fas fa-plus-circle"></i> Add Interception
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <div id="notification-container" class="notification-container">
    <!-- Notifications will be inserted here dynamically -->
  </div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
