<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Interceptor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo">
          <i class="fas fa-bolt"></i>
        </div>
        <h1>Request Interceptor</h1>
      </div>
      <div class="toggle-wrapper">
        <span class="status" id="status-text">Disabled</span>
        <label class="toggle">
          <input type="checkbox" id="enableToggle">
          <span class="slider"></span>
        </label>
      </div>
    </header>
    
    <!-- Main Content -->
    <main class="main">
      <!-- Navigation -->
      <nav class="nav">
        <div class="tabs">
          <button class="tab active" data-tab="routes">
            <i class="fas fa-route"></i>
            <span>Routes</span>
          </button>
          <button class="tab" data-tab="add">
            <i class="fas fa-plus"></i>
            <span>Add Route</span>
          </button>
        </div>
      </nav>
      
      <!-- Content Area -->
      <div class="content">
        <!-- Routes Tab -->
        <div class="tab-content active" id="routes-tab">
          
          <!-- Route Controls -->
          <div class="route-actions">
            <div class="filter-controls">
              <div class="search-input">
                <i class="fas fa-search"></i>
                <input type="text" id="search-routes" placeholder="Search routes...">
              </div>
              <select id="filter-method" class="btn-secondary btn-sm">
                <option value="all">All Methods</option>
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
                <option value="PATCH">PATCH</option>
              </select>
            </div>
            
            <button class="btn btn-danger" id="clear-routes-btn">
              <i class="fas fa-trash-alt"></i>
              <span>Clear All</span>
            </button>
          </div>
          
          <!-- Route List -->
          <div id="route-list" class="route-list">
            <!-- Empty state (shown when no routes exist) -->
            <div class="empty-state">
              <div class="empty-state-icon">
                <i class="fas fa-route"></i>
              </div>
              <h3>No routes configured yet</h3>
              <p>Add your first route to start intercepting API requests and mocking responses.</p>
              <button class="btn" id="add-first-route">
                <i class="fas fa-plus-circle"></i>
                <span>Add Your First Route</span>
              </button>
            </div>
          </div>
        </div>
        
        <!-- Add Route Tab -->
        <div class="tab-content" id="add-tab">
          <div class="card">
            <div class="card-header">
              <span id="form-title">Add New Route Interception</span>
            </div>
            <div class="card-body">
              <form id="add-route-form">
                <div class="form-group">
                  <label for="url">URL to Intercept</label>
                  <input type="text" id="url" placeholder="e.g. /api/users or https://example.com/api/data" required>
                  <div class="help-text">
                    Supports wildcards (*) and query parameters. Examples:
                    <code>/api/users</code>, <code>/api/users/*</code>, <code>https://api.example.com/data</code>
                  </div>
                </div>
                
                <div class="form-group">
                  <label for="method">HTTP Method</label>
                  <select id="method">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                    <option value="PATCH">PATCH</option>
                  </select>
                </div>
                
                <div class="input-row">
                  <div class="form-group">
                    <label for="status">Status Code</label>
                    <input type="number" id="status" value="200" min="100" max="599">
                  </div>
                  
                  <div class="form-group">
                    <label for="delay">Response Delay (ms)</label>
                    <input type="number" id="delay" value="0" min="0">
                  </div>
                </div>
                
                <div class="form-group">
                  <label for="contentType">Content Type</label>
                  <select id="contentType">
                    <option value="application/json">application/json</option>
                    <option value="text/plain">text/plain</option>
                    <option value="text/html">text/html</option>
                    <option value="application/xml">application/xml</option>
                  </select>
                </div>
                
                <div class="form-group">
                  <label for="responseBody">Response Body</label>
                  <textarea id="responseBody" placeholder='{"status": "success", "data": [{"id": 1, "name": "Example"}]}'>{"status": "success", "data": [{"id": 1, "name": "Example"}]}</textarea>
                  <div class="editor-actions">
                    <button type="button" id="formatJsonBtn" class="btn btn-sm btn-secondary">
                      <i class="fas fa-code"></i> Format JSON
                    </button>
                    <button type="button" id="clearEditorBtn" class="btn btn-sm btn-secondary">
                      <i class="fas fa-eraser"></i> Clear
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <div class="card-footer">
              <button type="button" id="cancelBtn" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancel
              </button>
              <button type="button" id="addRouteBtn" class="btn">
                <i class="fas fa-plus-circle"></i> Add Interception
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <!-- Notification Container -->
  <div id="notification-container" class="notification-container">
    <!-- Notifications will be inserted here dynamically -->
    <!-- Example notification (not displayed by default):
    <div class="notification notification-success">
      <div class="notification-icon">
        <i class="fas fa-check-circle"></i>
      </div>
      <div class="notification-content">
        <div class="notification-title">Success</div>
        <div class="notification-message">Route successfully added.</div>
      </div>
    </div>
    -->
  </div>
  
  <!-- Scripts -->
  <script src="sidepanel.js"></script>
</body>
</html>
